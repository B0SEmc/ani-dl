name: Publish to crates.io

# Publishes automatically when a version bump in Cargo.toml lands on main.
# Does nothing if that version is already on crates.io.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish if this version is new
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          meta=$(cargo metadata --no-deps --format-version 1)
          name=$(echo "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["name"])')
          version=$(echo "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "ci-publish-check" "https://crates.io/api/v1/crates/$name/$version")
          if [ "$code" = "200" ]; then
            echo "$name $version is already on crates.io, nothing to do."
          else
            cargo publish --locked
          fi
